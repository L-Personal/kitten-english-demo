<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#edf2ed">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'unsafe-inline'; worker-src 'self' blob:; media-src 'self'; img-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'none'">
<title>雨里的小猫 · 语音试玩</title>
<style>
:root{color-scheme:light;--ink:#183f38;--soft:#486059;--paper:#fffdf6;--green:#185947;--page:#edf2ed;--line:#cbd9d0}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;color:var(--ink);background:var(--page);font:16px/1.6 system-ui,-apple-system,"PingFang SC",sans-serif}main{max-width:31rem;margin:auto;padding:clamp(20px,5vh,44px) 16px 24px}article{background:var(--paper);border:1px solid var(--line);border-radius:24px;overflow:hidden}header{background:#dce9dc;border-bottom:1px solid var(--line);padding:20px;display:flex;gap:14px;align-items:center;justify-content:space-between;min-height:112px}header svg{width:76px;flex:none;height:auto}h1{font-size:clamp(24px,7.5vw,34px);line-height:1.15;letter-spacing:-.025em;margin:0}p{margin:0}.surface{display:grid;gap:14px;padding:20px}.sub{font-size:15px;color:var(--soft)}.note{font-size:13px;color:var(--soft)}button{min-height:48px;padding:10px 12px;font:inherit;font-weight:650;cursor:pointer;touch-action:manipulation;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:12px}button.primary{background:var(--green);color:#fff;border-color:var(--green);width:100%}button:focus-visible{outline:3px solid #8a522f;outline-offset:2px}#status{background:#e3efe5;color:#20443b;border:1px solid #cadfd0;padding:10px 12px;border-radius:10px}#status[data-state="error"]{background:#faeee2;border-color:#e3caad;color:#714721}#status[data-state="listen"]{font-weight:650}#stop{justify-self:start;border:0;text-decoration:underline;color:var(--soft);padding-inline:2px}progress{width:100%;accent-color:var(--green);height:12px}
</style>
</head>
<body><main><article aria-labelledby="title">
<header><h1 id="title">雨里的小猫</h1><svg aria-hidden="true" viewBox="0 0 96 96"><path d="m26 41 2-28 23 12 20-10 4 29c17 19 0 41-24 41-26 0-42-22-25-44Z" fill="#fff3d6" stroke="#584a3d" stroke-width="3" stroke-linejoin="round"/><path d="M35 55q5-6 10 0m9 0q5-6 10 0m-18 7 4 3 4-3m-40-41-6 10m11-25-6 10m74 9-6 10" fill="none" stroke="#584a3d" stroke-width="2.5" stroke-linecap="round"/></svg></header>
<section class="surface" id="intro"><p class="sub">听故事，用一句英语帮小猫。</p><button type="button" class="primary" id="start">开始语音试玩</button><p class="note">首次允许麦克风并加载语音包。之后听到叮声就开口。页面保持打开，声音在本机处理。</p></section>
<section class="surface" id="session" hidden><p id="status" role="status" aria-live="polite"></p><progress id="progress" aria-label="语音包加载进度" hidden></progress><button type="button" id="stop" hidden>结束试玩</button><button type="button" class="primary" id="restart" hidden>再玩一次</button></section>
</article></main><script type="module" src="./session.mjs"></script></body>
</html>
