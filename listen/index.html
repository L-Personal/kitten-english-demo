<p class="instruction">听一句，说出你喜欢哪种水果。</p>
<button type="button" id="play" hidden><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path id="icon" d="M8 5v14l12-7z"/></svg><span id="label">听一句</span></button>
<audio id="voice" controls preload="none" aria-label="真人英语录音" src="./apples-or-oranges.mp3"></audio>
<p class="status" id="status" role="status"></p>
<p class="note">中文或英语，一个词就行。这里不开麦。</p>

<footer>录音：<a href="https://www.manythings.org/tatoeba/">Charles Kelly（Tatoeba）</a> · <a href="https://creativecommons.org/licenses/by-nc-nd/3.0/deed.en">CC BY-NC-ND 3.0</a></footer>
</main>
<script>
const button = document.querySelector('#play'), audio = document.querySelector('#voice');
const label = document.querySelector('#label'), note = document.querySelector('#status'), icon = document.querySelector('#icon');
let phase = 'idle', timer, attempt = 0;
const labels = {idle:'听一句', loading:'声音载入中…', playing:'暂停', paused:'继续听', ended:'再听一遍', error:'重试播放'};
function show(next) {
  phase = next;
  label.textContent = labels[next];
  note.textContent = next === 'error' ? '这句没播出来。可以再试一次。' : '';
  button.setAttribute('aria-disabled', String(next === 'loading'));
  icon.setAttribute('d', next === 'playing' ? 'M8 5h3v14H8zm6 0h3v14h-3z' : 'M8 5v14l12-7z');
}
function failed() { clearTimeout(timer); ++attempt; show('error'); audio.pause(); }
audio.addEventListener('playing', () => { if (phase === 'loading') { clearTimeout(timer); show('playing'); } });
audio.addEventListener('ended', () => { if (phase !== 'error') show('ended'); });
audio.addEventListener('error', () => { if (phase !== 'idle' && phase !== 'error' && audio.error) failed(); });
button.addEventListener('click', () => {
  if (phase === 'loading') return;
  if (phase === 'playing') { audio.pause(); show('paused'); return; }
  const retry = phase === 'error';
  if (phase === 'ended') audio.currentTime = 0;
  if (retry) audio.load();
  const token = ++attempt;
  show('loading');
  timer = setTimeout(() => { if (token === attempt && phase === 'loading') failed(); }, 8000);
  audio.play().catch(() => { if (token === attempt && phase === 'loading') failed(); });
});
audio.controls = false;
audio.hidden = true;
button.hidden = false;
</script>
