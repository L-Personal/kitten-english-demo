<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f1f4eb">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'unsafe-inline'; worker-src 'self' blob:; media-src 'self'; img-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'none'">
<title>放学以后 · 英语语音试玩</title>
<style>
:root{color-scheme:light;--page:#f1f4eb;--paper:#fdfcf6;--ink:#1d4136;--muted:#405c52;--line:#bbcfc1;--lead:#185744;--accent:#dbebdd}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--page);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"PingFang SC",sans-serif}main{max-width:31rem;margin:auto;padding:clamp(18px,5vh,45px) 16px 32px}article{background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden}header{padding:21px 22px 20px;background:var(--accent);border-bottom:1px solid var(--line)}h1,p{margin:0}h1{font-size:clamp(27px,8vw,36px);letter-spacing:-.04em;line-height:1.2}.kicker{font-size:13px;font-weight:680;letter-spacing:.1em;margin:0 0 7px}.surface{padding:19px 21px;display:grid;gap:11px}.note{font-size:13px;color:var(--muted)}.subtitle{font-size:16px;color:var(--muted)}button{cursor:pointer;touch-action:manipulation;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);padding:9px 12px;font:inherit;font-weight:650}button:disabled{opacity:.55;cursor:default}button:focus-visible,audio:focus-visible{outline:3px solid #824c2b;outline-offset:3px}.entry{text-align:left;display:grid;gap:1px;padding:12px 14px;background:#edf3e9;border-color:#a8c5b3}.entry span{font-size:14px;font-weight:500;color:var(--muted)}.listen-demo{display:grid;gap:5px;margin-top:3px;padding-top:13px;border-top:1px solid var(--line)}.demo-title{font-size:14px;font-weight:650}audio{width:100%;height:44px}.mode{font-size:14px;font-weight:650;color:var(--muted)}#status{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#f2f4ed}#status[data-state="listen"]{background:var(--accent);font-weight:700}#status[data-state="error"]{background:#fbefe2;color:#6e3f25;border-color:#dcbaa8}progress{width:100%;height:10px;accent-color:var(--lead)}.controls{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.controls button{flex:1 0 auto}.primary{background:var(--lead);color:white;border-color:var(--lead)}
</style>
</head>
<body>
<main>
<article aria-labelledby="title">
<header><p class="kicker">英语语音试玩</p><h1 id="title">放学以后</h1></header>
<section class="surface" id="intro" aria-label="选择开场">
<p class="subtitle">选一个开场。用英语或中文接话都行。</p>
<button type="button" class="entry" data-mode="first" id="first"><strong>先说一句</strong><span>画画还是踢球？会说一个词就能开始。</span></button>
<button type="button" class="entry" data-mode="plan" id="plan"><strong>你来定计划</strong><span>下雨了，出门打球的计划怎么办？</span></button>
<p class="note">第一次请允许使用麦克风并等语音包加载。试玩时保持页面打开，声音只在本机处理。</p>
<div class="listen-demo"><p class="demo-title" id="sample-label">先听声音 · 不用麦克风</p><audio id="sample" controls preload="none" aria-labelledby="sample-label" src="./audio/sample.mp3"></audio><p class="note" id="sample-note">点播放，听两个开场。</p></div>
</section>
<section class="surface" id="session" hidden>
<p class="mode" id="mode"></p>
<p id="status" role="status" aria-live="polite"></p>
<progress id="progress" aria-label="语音包加载进度" hidden></progress>
<p class="note" id="help" hidden>想找点子，说「没想好」。不会用英文，说中文。想重听，说「再听一遍」。</p>
<div class="controls">
<button type="button" id="replay" disabled>再听一遍</button>
<button type="button" id="stop">结束试玩</button>
<button type="button" id="restart" class="primary" hidden>再玩一次</button>
<button type="button" id="back" hidden>返回选择</button>
</div>
</section>
</article>
</main>
<script type="module" src="./session.mjs"></script>
</body>
</html>
